catalogMode: prefer
cleanupUnusedCatalogs: true

shellEmulator: true
trustPolicy: no-downgrade

packages:
  - theme
  - demo
# Match Valaxy's workspace: keep transitive semver on the maintained major.
overrides:
  semver: ^7.7.4
catalog:
  '@antfu/eslint-config': ^6.4.2
  '@iconify-json/ant-design': ^1.2.5
  '@iconify-json/simple-icons': ^1.2.61
  '@types/node': ^24.0.0
  '@unocss/eslint-plugin': ^66.5.10
  '@valaxyjs/utils': 1.0.0-rc.11
  '@vueuse/core': ^14.0.0
  bumpp: ^10.3.2
  eslint: ^9.39.1
  eslint-plugin-format: ^1.1.0
  typescript: ^5.9.3
  valaxy: 1.0.0-rc.11
  vite: ^8.0.0
  vue: ^3.5.41
  vue-i18n: ^11.0.0
  vue-router: ^5.0.3
  vue-tsc: ^3.1.6
